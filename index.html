<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topografía Pro - ETRS89 & CAD Avanzado</title>

  <!-- Librerías Externas -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --accent: #00e676;
      --highlight: #ffea00;
      --text: #ffffff;
      --border: #333333;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      background: var(--panel-bg);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.1rem; color: var(--accent); }
    .container {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel {
      background: var(--panel-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #map {
      width: 100%;
      height: 480px;
      border-radius: 8px;
    }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    .btn-secondary { background: #333; color: #fff; }
    .btn-warn { background: var(--highlight); color: #000; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    th, td { border: 1px solid var(--border); padding: 6px; text-align: left; }
    th { background: #2a2a2a; color: var(--accent); }
    select, input {
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px;
      border-radius: 4px;
    }
    .cad-tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Topografía Pro - ETRS89 & CAD</h1>
    <label style="font-size: 0.85rem;">Huso ETRS89: 
      <select id="husoSelect">
        <option value="30" selected>Huso 30 (Centro/Península)</option>
        <option value="29">Huso 29 (Galicia/Oeste)</option>
        <option value="31">Huso 31 (Cataluña/Baleares)</option>
        <option value="28">Huso 28 (Canarias)</option>
      </select>
    </label>
  </header>

  <div class="container">
    
    <!-- CONTROLES PRINCIPALES -->
    <div class="panel">
      <button class="btn" onclick="capturarPuntoGPS()">📍 Capturar Punto GPS</button>
      <input type="file" id="dxfFileInput" accept=".dxf" style="display:none;" onchange
