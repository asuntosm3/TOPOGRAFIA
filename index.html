<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Topografía Pro 2026 - ETRS89 & Field CAD</title>

  <!-- Tipografías de Alta Legibilidad -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Librerías Externas -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>

  <style>
    :root {
      --bg-base: #080b11;
      --bg-surface: rgba(18, 26, 41, 0.75);
      --bg-surface-solid: #121a29;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(0, 242, 254, 0.3);
      --accent-primary: #00f2fe;
      --accent-secondary: #4facfe;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER FLOTANTE FUTURISTA */
    header {
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 12px;
      height: 12px;
      background: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-primary);
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .huso-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    select {
      background: transparent;
      border: none;
      color: var(--accent-primary);
      font-weight: 600;
      font-family: var(--font-sans);
      outline: none;
      cursor: pointer;
    }

    select option {
      background: var(--bg-surface-solid);
      color: var(--text-main);
    }

    /* CONTENEDOR PRINCIPAL */
    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* BARRA DE HERRAMIENTAS TÁCTILES */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      border-color: var(--border-accent);
      transform: translateY(-1px);
      background: rgba(30, 41, 59, 0.8);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000000;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
      transform: translateY(-1px);
    }

    .btn-warning {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--accent-warning);
    }

    .btn-warning:hover {
      background: rgba(245, 158, 11, 0.25);
    }

    /* MAPA LEAFLET ESTILO DARK HUD */
    .map-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    #map {
      width: 100%;
      height: 520px;
      background: #080b11;
    }

    /* PERSONALIZACIÓN OSCURA DE CONTROLES LEAFLET */
    .leaflet-control-layers {
      background: rgba(18, 26, 41, 0.9) !important;
      backdrop-filter: blur(12px);
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      color: var(--text-main) !important;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
      padding: 8px 12px !important;
    }

    .leaflet-control-layers-toggle {
      filter: invert(1);
    }

    .leaflet-bar a {
      background: rgba(18, 26, 41, 0.9) !important;
      color: var(--text-main) !important;
      border-bottom: 1px solid var(--border) !important;
      backdrop-filter: blur(12px);
    }

    /* PANALES HUD (GLASSMORPHISM) */
    .glass-panel {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-primary);
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cad-tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
    }

    /* TELEMETRÍA DE REPLANTEO HUD */
    .telemetry-box {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--accent-primary);
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 10px;
    }

    /* TABLA FUTURISTA DE PUNTOS */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.875rem;
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-weight: 600;
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-family: var(--font-mono);
      color: #e2e8f0;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .tag-nap {
      color: var(--accent-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- HEADER DE NAVEGACIÓN FUTURISTA -->
  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <h1>TOPOGRAFÍA <span style="color: var(--accent-primary); font-weight: 400;">PRO 2026</span></h1>
    </div>
    <div class="huso-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 29M2 12h20"/></svg>
      <span>ETRS89:</span>
      <select id="husoSelect">
        <option value="30" selected>Huso 30 (Centro)</option>
        <option value="29">Huso 29 (Galicia/Oeste)</option>
        <option value="31">Huso 31 (Cataluña/Baleares)</option>
        <option value="28">Huso 28 (Canarias)</option>
      </select>
    </div>
  </header>

  <div class="app-container">
    
    <!-- BARRA DE ACCIONES RÁPIDAS -->
    <div class="toolbar">
      <button class="btn btn-primary" onclick="capturarPuntoGPS()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3"/></svg>
        Capturar GPS
      </button>

      <input type="file" id="dxfFileInput" accept=".dxf" style="display:none;" onchange="cargarDXF(event)">
      <button class="btn" onclick="document.getElementById('dxfFileInput').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        Cargar DXF
      </button>

      <button class="btn" onclick="exportarCSV()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar CSV
      </button>
    </div>

    <!-- MAPA VISOR HUD -->
    <div class="map-wrapper">
      <div id="map"></div>
    </div>

    <!-- HERRAMIENTAS INTERACTIVAS CAD -->
    <div id="cadPanel" class="glass-panel" style="display:none;">
      <div class="panel-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        Herramientas de Selección & Replanteo CAD
      </div>

      <div id="selectedInfo" style="color: var(--text-muted); font-size: 0.9rem;">
        <i>Toca cualquier línea o polilínea en el mapa para iniciar el replanteo.</i>
      </div>
      
      <div class="cad-tools-grid" id="toolsContainer" style="display:none;">
        <button class="btn btn-warning" onclick="invertirSentidoPolilinea()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Invertir Sentido
        </button>

        <div class="input-group">
          <input type="number" id="offsetDist" class="input-field" placeholder="Dist. (m)" value="1.0" step="0.5" style="width: 110px;">
          <button class="btn" onclick="generarOffset(1)">➡ Par. Der</button>
          <button class="btn" onclick="generarOffset(-1)">⬅ Par. Izq</button>
        </div>
      </div>
      
      <div id="stakeoutMetrics" class="telemetry-box" style="display:none;"></div>
    </div>

    <!-- REGISTRO DE PUNTOS TOPOGRÁFICOS -->
    <div class="glass-panel">
      <div class="panel-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Registro de Coordenadas de Campo
      </div>
      <div class="table-container">
        <table id="tablaPuntos">
          <thead>
            <tr>
              <th>ID</th>
              <th>Easting (E)</th>
              <th>Northing (N)</th>
              <th>Cota NAP (H)</th>
              <th>Cota Elips. (h)</th>
              <th>N (Geoide)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // 1. CONFIGURACIÓN ETRS89
    proj4.defs("EPSG:25828", "+proj=utm +zone=28 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
    proj4.defs("EPSG:25829", "+proj=utm +zone=29 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
    proj4.defs("EPSG:25830", "+proj=utm +zone=30 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
    proj4.defs("EPSG:25831", "+proj=utm +zone=31 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");

    function latLngATransformadaETRS89(lat, lng, huso) {
      return proj4("EPSG:4326", `EPSG:258${huso}`, [lng, lat]);
    }

    function utmALatLng(x, y, huso) {
      const [lng, lat] = proj4(`EPSG:258${huso}`, "EPSG:4326", [x, y]);
      return [lat, lng];
    }

    // 2. MODELO GEOIDE REDNAP
    const GeoideIGN = {
      elipsoidalAOrtometrica: function(lat, lng, hElipsoidal) {
        return { cotaNAP: hElipsoidal - 50.2, ondulacionN: 50.2 };
      }
    };

    // 3. MAPA CON MOTOR LEAFLET Y CAPAS IGN / ESRI / CATASTRO
    const map = L.map('map', { zoomControl: false }).setView([40.4167, -3.7037], 15);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Ortofoto PNOA
    const pnoaLayer = L.tileLayer.wms('https://www.ign.es/wms-inspire/pnoa-ma', {
      layers: 'OI.OrtoimageCoverage', format: 'image/jpeg', transparent: false, version: '1.3.0',
      attribution: '© IGN - PNOA'
    }).addTo(map);

    // Satélite Respaldo
    const esriSatLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: '© Esri'
    });

    // Catastro
    const catastroLayer = L.tileLayer.wms('https://ovc.catastro.meh.es/Cartografia/WMS/ServidorWMS.aspx', {
      layers: 'Catastro', format: 'image/png', transparent: true, version: '1.1.1',
      attribution: '© Catastro'
    }).addTo(map);

    // Topográfico IGN
    const ignBaseLayer = L.tileLayer.wms('https://www.ign.es/wms-inspire/ign-base', {
      layers: 'IGNBaseTodo', format: 'image/png', transparent: false, version: '1.3.0',
      attribution: '© IGN'
    });

    L.control.layers(
      { "PNOA Ortofoto": pnoaLayer, "Esri Satélite": esriSatLayer, "Topográfico IGN": ignBaseLayer },
      { "Catastro Vectorial": catastroLayer },
      { position: 'topright' }
    ).addTo(map);

    // 4. INTERACCIÓN CAD Y REPLANTEO
    let cadLayerGroup = L.layerGroup().addTo(map);
    let selectedPolylineLayer = null;
    let selectedVerticesUTM = [];
    let selectedEntityMeta = null;

    function cargarDXF(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parser = new DxfParser();
          const dxf = parser.parseSync(e.target.result);
          renderizarDXF(dxf);
        } catch (err) {
          alert("Error decodificando DXF: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function renderizarDXF(dxf) {
      cadLayerGroup.clearLayers();
      deseleccionarElemento();
      
      const huso = parseInt(document.getElementById('husoSelect').value);
      const entities = dxf.entities || [];
      const latLngBounds = [];

      entities.forEach(ent => {
        let verticesUTM = [];

        if (ent.type === 'LINE') {
          verticesUTM = [{x: ent.vertices[0].x, y: ent.vertices[0].y}, {x: ent.vertices[1].x, y: ent.vertices[1].y}];
        } else if (ent.type === 'LWPOLYLINE' || ent.type === 'POLYLINE') {
          verticesUTM = ent.vertices.map(v => ({x: v.x, y: v.y}));
        } else if (ent.type === 'POINT') {
          const pt = utmALatLng(ent.position.x, ent.position.y, huso);
          latLngBounds.push(pt);
          const circle = L.circleMarker(pt, { radius: 6, color: '#ec4899', fillColor: '#ec4899', fillOpacity: 0.8 });
          circle.on('click', () => mostrarInfoPunto(ent));
          cadLayerGroup.addLayer(circle);
          return;
        }

        if (verticesUTM.length > 0) {
          const latLngs = verticesUTM.map(v => {
            const pt = utmALatLng(v.x, v.y, huso);
            latLngBounds.push(pt);
            return pt;
          });

          const polylineLayer = L.polyline(latLngs, { color: '#00f2fe', weight: 3 });
          
          polylineLayer.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            seleccionarPolilinea(polylineLayer, verticesUTM, ent);
          });

          cadLayerGroup.addLayer(polylineLayer);
        }
      });

      if (latLngBounds.length > 0) {
        document.getElementById('cadPanel').style.display = 'block';
        map.fitBounds(L.latLngBounds(latLngBounds), { padding: [40, 40] });
      }
    }

    function seleccionarPolilinea(layer, verticesUTM, meta) {
      if (selectedPolylineLayer) {
        selectedPolylineLayer.setStyle({ color: '#00f2fe', weight: 3 });
      }

      selectedPolylineLayer = layer;
      selectedVerticesUTM = verticesUTM;
      selectedEntityMeta = meta;

      selectedPolylineLayer.setStyle({ color: '#f59e0b', weight: 6 });

      document.getElementById('selectedInfo').innerHTML = `
        <span style="color: var(--accent-primary); font-weight:600;">Elemento Seleccionado:</span> ${meta.type} | 
        <span style="color: var(--accent-primary); font-weight:600;">Capa:</span> ${meta.layer} | 
        <span style="color: var(--accent-primary); font-weight:600;">Vértices:</span> ${verticesUTM.length}
      `;

      document.getElementById('toolsContainer').style.display = 'flex';
    }

    function mostrarInfoPunto(meta) {
      document.getElementById('cadPanel').style.display = 'block';
      document.getElementById('selectedInfo').innerHTML = `
        <span style="color: var(--accent-pink); font-weight:600;">Punto Vértice:</span> Capa ${meta.layer} | 
        X: ${meta.position.x.toFixed(3)} | Y: ${meta.position.y.toFixed(3)}
      `;
      document.getElementById('toolsContainer').style.display = 'none';
    }

    function deseleccionarElemento() {
      if (selectedPolylineLayer) {
        selectedPolylineLayer.setStyle({ color: '#00f2fe', weight: 3 });
      }
      selectedPolylineLayer = null;
      selectedVerticesUTM = [];
      document.getElementById('toolsContainer').style.display = 'none';
      document.getElementById('selectedInfo').innerHTML = '<i>Toca cualquier línea o polilínea en el mapa para iniciar el replanteo.</i>';
      document.getElementById('stakeoutMetrics').style.display = 'none';
    }

    // 5. INVERTIR Y OFFSET
    function invertirSentidoPolilinea() {
      if (!selectedVerticesUTM || selectedVerticesUTM.length < 2) return;

      selectedVerticesUTM.reverse();
      const huso = parseInt(document.getElementById('husoSelect').value);
      const nuevosLatLngs = selectedVerticesUTM.map(v => utmALatLng(v.x, v.y, huso));
      
      selectedPolylineLayer.setLatLngs(nuevosLatLngs);
      
      const metricsBox = document.getElementById('stakeoutMetrics');
      metricsBox.style.display = 'block';
      metricsBox.innerHTML = '⚡ <b>Sentido invertido:</b> Origen y destino intercambiados.';
    }

    function generarOffset(signo) {
      if (!selectedVerticesUTM || selectedVerticesUTM.length < 2) return;

      const dist = parseFloat(document.getElementById('offsetDist').value) * signo;
      const huso = parseInt(document.getElementById('husoSelect').value);
      const offsetUTM = [];

      for (let i = 0; i < selectedVerticesUTM.length - 1; i++) {
        const p1 = selectedVerticesUTM[i];
        const p2 = selectedVerticesUTM[i + 1];

        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);

        if (len === 0) continue;

        const nx = -dy / len;
        const ny = dx / len;

        const off1 = { x: p1.x + nx * dist, y: p1.y + ny * dist };
        const off2 = { x: p2.x + nx * dist, y: p2.y + ny * dist };

        if (i === 0) offsetUTM.push(off1);
        offsetUTM.push(off2);
      }

      const offsetLatLngs = offsetUTM.map(v => utmALatLng(v.x, v.y, huso));
      const offsetLayer = L.polyline(offsetLatLngs, { color: '#ec4899', weight: 2, dashArray: '6, 6' });
      
      cadLayerGroup.addLayer(offsetLayer);

      const metricsBox = document.getElementById('stakeoutMetrics');
      metricsBox.style.display = 'block';
      metricsBox.innerHTML = `✔ <b>Línea paralela generada:</b> Offset de ${dist} metros.`;
    }

    // 6. CAPTURA GPS Y EXPORTACIÓN
    let listaPuntos = [];

    function capturarPuntoGPS() {
      if (!navigator.geolocation) return alert("El navegador no soporta geolocalización GPS.");

      const huso = parseInt(document.getElementById('husoSelect').value);

      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const hGPS = pos.coords.altitude || 0;

        const [easting, northing] = latLngATransformadaETRS89(lat, lng, huso);
        const altimetria = GeoideIGN.elipsoidalAOrtometrica(lat, lng, hGPS);

        const punto = {
          id: `P-${String(listaPuntos.length + 1).padStart(3, '0')}`,
          easting: easting.toFixed(3),
          northing: northing.toFixed(3),
          cotaNAP: altimetria.cotaNAP.toFixed(3),
          hGPS: hGPS.toFixed(3),
          N: altimetria.ondulacionN.toFixed(2)
        };

        listaPuntos.push(punto);
        
        const tbody = document.querySelector('#tablaPuntos tbody');
        tbody.innerHTML += `<tr>
          <td><b>${punto.id}</b></td>
          <td>${punto.easting}</td>
          <td>${punto.northing}</td>
          <td class="tag-nap">${punto.cotaNAP}</td>
          <td>${punto.hGPS}</td>
          <td>${punto.N}</td>
        </tr>`;

        L.marker([lat, lng]).addTo(map).bindPopup(`<b>${punto.id}</b><br>H (NAP): ${punto.cotaNAP} m`).openPopup();
        map.setView([lat, lng], 18);
      }, (err) => alert("Error capturando GPS: " + err.message), { enableHighAccuracy: true });
    }

    function exportarCSV() {
      if (listaPuntos.length === 0) return alert("No hay puntos guardados.");
      let csv = "ID,Easting,Northing,Cota_NAP,Cota_Elipsoidal,N_Geoide\n";
      listaPuntos.forEach(p => {
        csv += `${p.id},${p.easting},${p.northing},${p.cotaNAP},${p.hGPS},${p.N}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `Puntos_ETRS89_H${document.getElementById('husoSelect').value}.csv`);
      a.click();
    }
  </script>
</body>
